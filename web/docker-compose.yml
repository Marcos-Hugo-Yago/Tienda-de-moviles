services:
  mariadb:
    image: mariadb
    container_name: mariadb5
    restart: unless-stopped
    env_file:
      - ./credenciales
    volumes:
      - mariadb-datab5:/var/lib/mysql
      - ./moviles.sql:/docker-entrypoint-initdb.d/moviles.sql:ro
    networks:
      - database_network

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadminb5
    restart: unless-stopped
    environment:
      - PMA_HOST=mariadb5
    ports:
      - "7105:80"
    depends_on:
      - mariadb
    networks:
      - database_network
      - frontend_network

  python:
    build: ./api
    container_name: pythonb5
    restart: unless-stopped
    env_file:
      - ./credenciales
    environment:
      - PASSWORD_PEPPER=pimientaSecreta123
      - SECRET_KEY=claveSuperSecretaParaSesiones
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mariadb
    networks:
      - backend_network
      - database_network

  apache-waf:
    build: ./apache
    container_name: apacheb5
    restart: unless-stopped
    ports:
      - "6105:80"
      - "6443:443"
    depends_on:
      - python
    links:
      - python
    networks:
      - frontend_network
      - backend_network

volumes:
  mariadb-datab5:

networks:
  frontend_network:
    name: grupob5_frontend
    driver: bridge
  backend_network:
    name: grupob5_backend
    driver: bridge
    internal: true
  database_network:
    name: grupob5_database
    driver: bridge
