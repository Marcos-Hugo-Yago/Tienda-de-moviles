<IfModule mod_evasive20.c>
    DOSHashTableSize 3097
    DOSPageCount 5
    DOSSiteCount 50
    DOSPageInterval 2
    DOSSiteInterval 2
    DOSBlockingPeriod 10
    DOSLogDir /var/log/mod_evasive
    DOSEmailNotify root@localhost
    DOSSystemCommand "su - someuser -c '/sbin/iptables -A INPUT -s %s -j DROP && /sbin/iptables -A INPUT -s %s -j DROP'"
</IfModule>
