SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

# SQL Injection detection
SecRule REQUEST_COOKIES|!REQUEST_COOKIES:/__utm/|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS|XML:/* "@rx (?i)(\bselect\b.*\bfrom\b|\bunion\b.*\bselect\b|\binsert\b.*\binto\b|\bdelete\b.*\bfrom\b|\bdrop\b.*\btable\b|\bdeclare\b.*\bchar\b|exec\b.*\(|\bexec\b.*\bxp_)" \
    "id:300001,phase:2,deny,status:403,msg:'SQL Injection Attack Detected',logdata:'%{MATCHED_VAR}',severity:'2'"

# XSS detection
SecRule REQUEST_COOKIES|!REQUEST_COOKIES:/__utm/|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS|XML:/* "@rx (?i)(<script[^>]*>|javascript:|onerror\s*=|onload\s*=|onclick\s*=|onmouseover\s*=|eval\s*\(|fromCharCode|<iframe|<object|<embed|<svg|alert\s*\()" \
    "id:300002,phase:2,deny,status:403,msg:'XSS Attack Detected',logdata:'%{MATCHED_VAR}',severity:'2'"

# Path Traversal / LFI detection
SecRule ARGS "@rx (?i)(\.\./|\.\.\\|/etc/passwd|/etc/shadow|/proc/self/environ|boot\.ini|/windows/win\.ini)" \
    "id:300003,phase:2,deny,status:403,msg:'Path Traversal / LFI Attack Detected',severity:'2'"

# RFI detection (block only dangerous wrappers, not legit HTTP URLs)
SecRule ARGS "@rx (?i)(php://input|php://filter|data://|expect://)" \
    "id:300004,phase:2,deny,status:403,msg:'RFI Attack Detected',severity:'2'"

# Command injection detection
SecRule ARGS "@rx (?i)(;\s*$|\||`.*`|\$\s*\(|cmd=|/bin/sh|/bin/bash|/usr/bin/perl|wget\s+|curl\s+)" \
    "id:300005,phase:2,deny,status:403,msg:'Command Injection Attack Detected',severity:'2'"

# Block common scanners and bots
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(nikto|wikto|dirbuster|sqlmap|nmap|nessus|openvas|acunetix|netsparker|appscan)" \
    "id:300006,phase:1,deny,status:403,msg:'Scanner/Bot Detected',severity:'2'"

# Block dangerous HTTP methods
SecRule REQUEST_METHOD "@rx ^(?:CONNECT|TRACE|TRACK)$" \
    "id:300007,phase:1,deny,status:403,msg:'HTTP method not allowed'"

# Request size limits
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyInMemoryLimit 1048576
