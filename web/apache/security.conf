ServerTokens Prod
ServerSignature Off
TraceEnable Off

<DirectoryMatch "^/.*/\.git">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "^/.*/\.svn">
    Require all denied
</DirectoryMatch>

LimitRequestBody 10485760
LimitRequestFields 100
LimitRequestFieldSize 8190
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

FileETag None

Header edit Set-Cookie ^((?!csrf_token).*)$ $1;HttpOnly;Secure;SameSite=Lax
