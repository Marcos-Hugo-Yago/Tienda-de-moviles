<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Last-Modified" content="0">
    <title>Tienda de Móviles - Añadir Móvil</title>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");
        function guardar() {
            let nombre = document.getElementById("nombre").value;
            let descripcion = document.getElementById("descripcion").value;
            let ingredientes = document.getElementById("ingredientes").value;
            let precio = document.getElementById("precio").value;
            let foto = document.getElementById("foto").value;
            let datos = JSON.stringify({
                "nombre": nombre,
                "descripcion": descripcion,
                "ingredientes": ingredientes,
                "precio": precio,
                "foto": foto
            });
            var requestOptions = {
                method: 'POST',
                headers: myHeaders,
                body: datos
            };

            fetch("/api/Moviles/", requestOptions)
                .then(response => response.json())
                .then(result => {
                    if (result.status == "OK") {
                        alert("Móvil guardado")
                        location.href = "moviles.html"
                    } else {
                        alert("El móvil no ha podido ser guardado")
                    }
                })
                .catch(error => {
                    console.log('error', error);
                    alert("Se ha producido un error y el móvil no ha podido ser guardado")
                });
        }
    </script>
</head>

<body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <span class="navbar-item has-text-weight-bold">
                Tienda de Móviles
            </span>
        </div>
        <div class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="moviles.html">Móviles</a>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h3 style="text-align: center; margin-bottom: 25px;">Agregar Móvil</h3>
            <form action="javascript:void(0);">
                <div class="field">
                    <label for="nombre">Nombre:</label>
                    <input required type="text" placeholder="Nombre del móvil" name="nombre" id="nombre">
                </div>
                <div class="field">
                    <label for="descripcion">Descripción:</label>
                    <input required type="text" placeholder="Breve descripción" name="descripcion" id="descripcion">
                </div>
                <div class="field">
                    <label for="ingredientes">Fabricante:</label>
                    <input required type="text" placeholder="Fabricante" name="ingredientes" id="ingredientes">
                </div>
                <div class="field">
                    <label for="precio">Precio:</label>
                    <input required type="number" placeholder="Precio en €" name="precio" id="precio">
                </div>
                <div class="field">
                    <label for="foto">URL de Foto:</label>
                    <input required type="text" placeholder="http://..." name="foto" id="foto">
                </div>
                <div class="field">
                    <label for="filefoto">O subir archivo:</label>
                    <input type="file" name="filefoto" id="filefoto"
                        style="border: none; background: transparent; padding-left: 0;">
                </div>

                <div class="field" style="display: flex; gap: 10px; justify-content: center; margin-top: 30px;">
                    <button type="button" onclick="guardar()" class="button is-success">Guardar</button>
                    <a href="moviles.html" class="button" style="background-color: #f0f0f0; color: #333;">Volver</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
