<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJEMPLO APP WEB CON CRUD</title>

    <link rel="stylesheet" href="css/styles.css">

    <script>
        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");

        onload = function () {
            pedirMoviles();
        }

        function pintarMoviles(lista) {
            let tbody = document.getElementsByTagName("tbody")[0];
            tbody.innerText = "";

            lista.forEach(movil => {
                let texto = `<tr>
                        <td><img src="${movil.foto}" width="70"></td>
                        <td>${movil.nombre}</td>
                        <td>${movil.descripcion}</td>
                        <td>${movil.ingredientes}</td>
                        <td>${movil.precio} €</td>
                        <td>${(movil.precio * 1.21).toFixed(2)} € </td>
                        <td>`
                texto += `<a href="editar_movil.html?id=${movil.id}" class="button is-info is-small">Editar</a>
                        </td>
                        <td>
                            <button class="button is-danger is-small" onclick="eliminarMovil(${movil.id})">Eliminar</button>
                        </td>
                    </tr>`;
                tbody.innerHTML += texto;
            });
        }

        function pedirMoviles() {
            fetch("/api/Moviles/", {
                method: 'GET',
                headers: myHeaders
            })
                .then(response => response.json())
                .then(result => pintarMoviles(result))
                .catch(error => {
                    console.log('error', error);
                    alert("Ha habido un error al recuperar las moviles. Refresque la página")
                });
        }

        function eliminarMovil(id) {
            if (!confirm("¿Estás seguro de que quieres eliminar este móvil?")) return;
            fetch("/api/Moviles/" + id, {
                method: 'DELETE',
                headers: myHeaders
            })
                .then(response => response.json())
                .then(result => {
                    if (result.status == "OK") {
                        // alert("Móvil eliminado");
                        pedirMoviles();
                    } else {
                        alert("El móvil no ha podido ser eliminado");
                    }
                })
                .catch(error => {
                    console.log('error', error);
                    alert("Se ha producido un error y el móvil no ha podido ser eliminado");
                });
        }

        function cerrarSesion() {
            fetch("/api/usuarios/logout", {
                method: 'GET',
                headers: myHeaders
            })
                .then(response => response.json())
                .then(result => {
                    if (result.status == "OK") {
                        location.href = "index.html";
                    } else {
                        alert("No se ha podido cerrar sesión");
                    }
                })
                .catch(error => {
                    console.log('error', error);
                    alert("Se ha producido un error y no se ha podido cerrar sesión");
                });
        }
    </script>
</head>

<body>

    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <span class="navbar-item has-text-weight-bold">
                Tienda de Móviles
            </span>
        </div>

        <div class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="moviles.html">Móviles</a>
                <a class="navbar-item" href="ficheros.html">Archivos</a>
                <a class="navbar-item" href="javascript:cerrarSesion()">Cerrar sesión</a>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin-bottom: 0;">Móviles</h3>
                <a id="enlaceAgregar" href="agregar_movil.html" class="button is-success">Agregar</a>
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Descripcion</th>
                            <th>Fabricante</th>
                            <th>Precio</th>
                            <th>PrecioIVA</th>
                            <th>Editar</th>
                            <th>Eliminar</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>

</html>
