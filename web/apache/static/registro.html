<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Last-Modified" content="0">
    <title>Tienda de Móviles - Registro</title>

    <link rel="stylesheet" href="css/styles.css">

    <script>
        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");

        function conectar() {
            document.getElementsByClassName("error")[0].style.display = "none";

            var raw = JSON.stringify({
                "username": document.getElementById("username").value,
                "password": document.getElementById("password").value,
                "correo": document.getElementById("correo").value
            });

            fetch("/api/usuarios/registro", {
                method: 'POST',
                headers: myHeaders,
                body: raw
            })
                .then(response => response.json())
                .then(result => {
                    if (result.status == "OK") {
                        alert("Usuario registrado correctamente");
                        location.href = "index.html";
                    } else {
                        document.getElementsByClassName("error")[0].style.display = "block";
                    }
                })
                .catch(error => console.log('error', error));
        }
    </script>
</head>

<body>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="logo">Registro</div>
            <div class="subtitle">Crea tu cuenta</div>

            <input type="text" name="username" placeholder="Usuario" id="username" required>

            <input type="email" name="correo" placeholder="Correo electrónico" id="correo" required>

            <input type="password" name="password" placeholder="Contraseña" id="password" required>

            <div class="error">Error al registrar usuario</div>

            <button class="btn-primary" type="button" onclick="conectar()">ENVIAR</button>
            <button class="btn-secondary" type="button" onclick="location.href='index.html'"
                style="margin-top: 10px; width: 100%;">Volver</button>
        </div>
    </div>

</body>

</html>
