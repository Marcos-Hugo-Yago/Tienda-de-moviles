<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Last-Modified" content="0">
    <title>Tienda de Móviles - Iniciar sesión</title>

    <link rel="stylesheet" href="css/styles.css">

    <script>
        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");

        function verComentarios() {
            location.href = "comentarios.html";
        }

        function conectar() {
            document.getElementsByClassName("error")[0].style.display = "none";

            var raw = JSON.stringify({
                "username": document.getElementById("username").value,
                "password": document.getElementById("password").value
            });

            fetch("/api/usuarios/login", {
                method: 'POST',
                headers: myHeaders,
                body: raw
            })
                .then(response => response.json())
                .then(result => {
                    if (result.status === "OK") {
                        location.href = "moviles.html";
                    } else {
                        document.getElementsByClassName("error")[0].style.display = "block";
                    }
                })
                .catch(error => console.log('error', error));
        }
    </script>
</head>

<body>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="logo">Tienda de Móviles</div>
            <div class="subtitle">Accede a tu cuenta para ver nuestro catálogo</div>

            <input type="text" id="username" name="username" placeholder="Usuario">
            <input type="password" id="password" name="password" placeholder="Contraseña">

            <div class="error">Usuario/clave errónea</div>

            <button class="btn-login" type="button" onclick="conectar()">Iniciar sesión</button>
            <button class="btn-register" type="button" onclick="location.href='registro.html'">Registrarse</button>

            <div class="extra-section">
                <h3>Opiniones de clientes</h3>
                <button class="btn-login" type="button" onclick="verComentarios()">Ver comentarios</button>
            </div>
        </div>
    </div>

</body>

</html>
