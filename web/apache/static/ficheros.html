<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Last-Modified" content="0">
    <title>Tienda de Móviles - Gestión de Archivos</title>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");

        function getCookie(name) {
            var value = "; " + document.cookie;
            var parts = value.split("; " + name + "=");
            if (parts.length == 2) return parts.pop().split(";").shift();
        }
        var csrfToken = getCookie("csrf_token");
        if (csrfToken) {
            myHeaders.append("X-CSRFToken", csrfToken);
        }

        var allowedExtensions = ['txt', 'pdf', 'jpg', 'jpeg', 'png', 'gif', 'bmp', 'doc', 'docx', 'xls', 'xlsx', 'csv', 'md', 'log'];
        var maxFileSize = 5 * 1024 * 1024; // 5 MB

        function enviarArchivo() {
            var fileInput = document.getElementById("fichero");
            var file = fileInput.files[0];

            if (!file) {
                alert("Selecciona un archivo primero");
                return;
            }

            var ext = file.name.split('.').pop().toLowerCase();
            if (!allowedExtensions.includes(ext)) {
                alert("Tipo de archivo no permitido. Extensiones aceptadas: " + allowedExtensions.join(', '));
                return;
            }

            if (file.size > maxFileSize) {
                alert("El archivo excede el tamaño máximo de 5 MB");
                return;
            }

            var uploadHeaders = new Headers();
            if (csrfToken) {
                uploadHeaders.append("X-CSRFToken", csrfToken);
            }

            const formData = new FormData();
            formData.append('fichero', file);
            formData.append('nombre', document.getElementById("nombre").value);
            var requestOptions = {
                method: 'POST',
                headers: uploadHeaders,
                body: formData
            };

            fetch("/api/ficheros/", requestOptions)
                .then(response => response.json())
                .then(result => {
                    if (result.status == "OK") {
                        alert("Archivo subido correctamente como: " + result.filename);
                        document.getElementById("nombre").value = "";
                        document.getElementById("fichero").value = "";
                    } else {
                        alert("Error: " + (result.status || "El archivo no ha podido subirse"));
                    }
                })
                .catch(error => {
                    console.log('error', error);
                    alert("Ha habido un error al subir el archivo.")
                });
        }

        function verArchivo() {
            var requestOptions = {
                method: 'GET',
                headers: myHeaders
            };

            fetch("/api/ficheros/" + document.getElementById("nombreArchivo").value, requestOptions)
                .then(response => response.json())
                .then(result => {
                    if (result.contenido != undefined) {
                        document.getElementById("contenidoArchivo").value = result.contenido;
                    } else {
                        document.getElementById("contenidoArchivo").value = "EL CONTENIDO NO ESTÁ DISPONIBLE";
                    }
                })
                .catch(error => {
                    console.log('error', error);
                    alert("Ha habido un error al recuperar el archivo.")
                });
        }

    </script>
</head>

<body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <span class="navbar-item has-text-weight-bold">
                Tienda de Móviles
            </span>
        </div>

        <div class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="moviles.html">Móviles</a>
                <a class="navbar-item" href="ficheros.html">Archivos</a>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div class="card mb-4" style="max-width: 600px; margin: 0 auto 2rem auto;">
            <h3 style="text-align: center;">Subir un Archivo</h3>
            <div class="field">
                <label for="nombre">Nombre archivo:</label>
                <input type="text" name="nombre" id="nombre" placeholder="Nombre para guardar">
            </div>
            <div class="field">
                <label for="fichero">Archivo:</label>
                <input type="file" name="fichero" id="fichero" style="border: none; padding-left: 0;">
            </div>
            <div class="field" style="text-align: center;">
                <button type="button" class="button is-success" onclick="enviarArchivo()">Subir Archivo</button>
            </div>
        </div>

        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h3 style="text-align: center;">Ver Contenido de Archivo</h3>
            <div class="field">
                <label for="nombreArchivo">Nombre archivo:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" name="nombreArchivo" id="nombreArchivo" placeholder="Nombre del archivo a buscar"
                        style="margin-bottom: 0;">
                    <button type="button" class="button is-info" onclick="verArchivo()">Ver</button>
                </div>
            </div>
            <div class="field">
                <label for="contenidoArchivo">Contenido:</label>
                <textarea id="contenidoArchivo" rows="10" readonly></textarea>
            </div>
        </div>
    </div>
</body>

</html>
